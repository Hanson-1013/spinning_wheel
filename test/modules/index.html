<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>单模组细节查看</title><style>
*{box-sizing:border-box}body{margin:0;background:#101814;color:#e0dac7;font:14px system-ui}canvas{display:block;width:100%;height:100dvh;touch-action:none}header{position:fixed;top:0;left:0;right:0;background:#111c18ed;padding:14px;z-index:2;display:flex;gap:10px;flex-wrap:wrap;align-items:center}select,button,a{font:inherit;color:#e0dac7;background:#23312a;border:1px solid #64705b;border-radius:5px;padding:9px;text-decoration:none}select{flex:1;min-width:145px}#status{position:fixed;bottom:20px;left:15px;right:15px;text-align:center;pointer-events:none;color:#b8c1b4;font-size:12px}button{cursor:pointer}</style></head><body><header><select id="module" aria-label="选择模组"><option value="piano">钢琴与垂布</option><option value="player">音乐播放器</option><option value="clock">辉光钟与底座</option><option value="monstera">龟背竹</option><option value="palm">散尾葵</option><option value="frame">悬空画框</option><option value="towers">双台复古电脑主机</option><option value="desk">书桌与桌面陈设</option><option value="shelf">书架与牛皮卷轴</option><option value="rug">地毯</option><option value="hanging">吊盆藤蔓</option></select><button id="reset">复位视角</button><button id="rotate">自动转动</button><a href="/test">全景</a></header><div id="status" role="status">正在加载模组…</div><script type="module" src="/src/module-viewer.js"></script></body></html>
