<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>纺车 · Water Atelier</title>
</head>
<body>
<main id="app">
<div id="scene">
</div>
<header>
<a class="brand" href="#">REVERSE<span>1999</span>
</a>
<span class="edition">Provided by Hanson</span>
</header>
<section class="title">
<div class="eyebrow">GOLDEN THREAD — THE SPINNING WHEEL</div>
<h1>纺车<span>A wheel above the water.</span>
</h1>
<p>命运的金线</p>
</section>
<section class="model-tools" aria-label="纺车操作">
<button id="model-reset" aria-hidden="true" disabled>再次转动</button>
</section>
<aside id="panel" hidden>
<div class="panel-title">外观与演出 <span>LIVE</span>
</div>
<label for="wood-style">木材纹理</label>
<select id="wood-style">
<option value="natural">自然细木纹</option>
<option value="walnut">深胡桃木</option>
<option value="oak">浅橡木</option>
<option value="aged">风化旧木</option>
</select>
<div class="buttons">
<button id="pause">暂停演出</button>
<button id="reset">重置</button>
</div>
<p>围绕轮心画弧，唤起四周的光<br>越接近终点，阻力越明显</p>
</aside>
<footer>
<span>
<i>
</i> <b id="status">正在构建空间</b>
</span>
<span>reverse <em>·</em> 1999</span>
<span class="hint">DRAG TO EXPLORE ⤴</span>
</footer>
<div id="error" hidden>
</div>
</main>
<script type="module" src="/src/main.js">
</script>
</body>
</html>
